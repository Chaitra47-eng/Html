<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: cornsilk;
        }
        .ball{
            width: 150px;
            height: 150px;
            background-color: maroon;
            border-radius: 50%;
            animation: bounce 1000ms ease-in-out alternate infinite;
        }
        @keyframes bounce{
            from{
                 transform: translateY(200px);
            }
            to{
               transform: translateY(-200px);
               background-color: blue;
            }
        }
        .main>.ball:nth-child(1){
            animation-delay: 100ms;
        }
        .main>.ball:nth-child(2){
            animation-delay: 200ms;
        }
        .main>.ball:nth-child(3){
            animation-delay: 300ms;
        }
        .main>.ball:nth-child(4){
            animation-delay: 400ms;
        }
        .main>.ball:nth-child(5){
            animation-delay: 500ms;
        }
        .main>.ball:nth-child(6){
            animation-delay: 600ms;
        }
        .main>.ball:nth-child(7){
            animation-delay: 700ms;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
    </div>
</body>
</html>
