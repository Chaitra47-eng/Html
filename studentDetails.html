<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Student Details </legend>
            <fieldset>
            <legend>Personal</legend><br><br>
            <label for=" ">First Name: </label><input
            type="text" placeholder="FIRST NAME"><br><br>
            <label for=" ">Last Name: </label><input
            type="text" placeholder="LAST NAME"><br><br>
            <label for=" ">Father's Name: </label><input
            type="text" placeholder="FATHER'S NAME"><br><br>
            <label for=" ">Mother's Name: </label><input
            type="text" placeholder="MOTHER'S NAME"><br><br>
            <label for=" ">DOB: </label><input
            type="date" placeholder="DATE"><br><br>
            <label for=" ">Gender:</label>
            <input type="radio" name="Gender" id="male"><label for="male">Male</label>
            <input type="radio" name="Gender" id="female"><label for="female">Female</label>
            <input type="radio" name="Gender" id="other"><label for="other">Other</label><br><br>
            <strong>Blood Group:</strong>
            <select name="" id="">
                <option value=""  hidden>---------------choose here-------</option>
                <option value="" >A</option>
                <option value="" >B</option>
                <option value="" >AB</option>
                <option value="" >O</option><br><br>
                </select>
                </fieldset>

        
            <fieldset>
               <legend>Contact </legend>
              <label for=" ">Mobile No: </label><input
                type="MOb NO" placeholder="Mob No"><br><br>
                <label for=" ">Email id: </label><input
                type="email" placeholder="EMAIL"><br><br>
                <label for=" ">Address: </label><input
                type="text" placeholder="ADDRESS"><br><br>
               <label for=" ">Country:</label>
                <select name="" id="">
                <option value=""  hidden>---------------choose here-------</option>
                <option value="" >India</option>
                <option value="" >America</option>
                <option value="" >Switzerland</option>
                <option value="" >Paris</option>
                </select><br><br>
                <label for=" ">pincode: </label><input
                 type="pincode" placeholder="PINCODE">
            </fieldset>

            <fieldset>
                <legend>Education</legend>
                <strong>Highest Degree:</strong>
                <select name="" id="">
                <option value=""  hidden>---------------choose here-------</option>
                <option value="" >BE</option>
                <option value="" >BCA</option>
                <option value="" >B.COM</option>
                <option value="" >PG</option>
            </select><br><br>
            <strong>stream:</strong>

            <input type="radio" name="stream" id="CS"><label for="CS">CS</label>
            <input type="radio" name="stream" id="IT"><label for="IT">IT</label>
            <input type="radio" name="stream" id="EC"><label for="EC">EC</label>
            <input type="radio" name="stream" id="MECH"><label for="MECH">Mech</label>
            <input type="radio" name="stream" id="CIV"><label for="CIV">Civil</label>
            <input type="radio" name="stream" id="EEE"><label for="EEE">EEE</label><br><br>
             <label for=" ">If Other: </label><input
              type="text" placeholder="OTHER STREAM"><br><br>
             <label for=" ">University Name: </label><input
             type="text" placeholder="UNIVERSITY NAME"><br><br>
             <label for=" ">Year of Passing: </label><input
             type="text" placeholder="YEAR OF PASSING"><br><br>
             <label for=" ">Percentage: </label><input
             type="text" placeholder="PERCENTAGE"><br><br>
            </fieldset>

        <fieldset>
            <legend>placement</legend>
            <label for=" ">Skills: </label>
            
            <input type="checkbox" name="Skills" id=""><label for="">HTML</label>
            <input type="checkbox" name="Skills" id=""><label for="">CSS</label>
            <input type="checkbox" name="Skills" id=""><label for="">JavaScript</label><br><br>
            <input type="checkbox" name="Skills" id=""><label for="">ReactJS</label>
            <input type="checkbox" name="Skills" id=""><label for="">REACT NATIVE</label>
            <input type="checkbox" name="Skills" id=""><label for="">TensorFlow</label>
            <input type="checkbox" name="Skills" id=""><label for="">Node JS</label>
            <input type="checkbox" name="Skills" id=""><label for="">ElectronJS</label><br><br>
            <label for=" ">Domain: </label>
            <input type="radio" name="Domain" id="Devops"><label for="Devops">DevOps</label>
            <input type="radio" name="Domain" id="Testing"><label for="Testing">Testing</label>
            <input type="radio" name="Domain" id="Dev"><label for="Dev">Dev</label>
            <input type="radio" name="Domain" id="Support"><label for="Support">Support</label><br><br>
            <label for=" ">Place of Preference: </label>
            <input type="radio" name="placeOfPreference" id="Hyderabad"><label for="Hyderabad">Hyderabad</label>
            <input type="radio" name="placeOfPreference" id="Pune"><label for="Pune">Pune</label>
            <input type="radio" name="placeOfPreference" id="Delhi"><label for="Delhi">Delhi</label>
            <input type="radio" name="placeOfPreference" id="PanIndia"><label for="PanIndia">Pan India</label><br><br>
            <label for=" ">Expected Salary: </label>
            <input type="radio" name="expectedSalary" id="0-5"><label for="0-5">0-5 LPA</label>
            <input type="radio" name="expectedSalary" id="5-10"><label for="5-10">5-10 LPA</label>
            <input type="radio" name="expectedSalary" id="10-15"><label for="10-15">10-15 LPA</label>
            <input type="radio" name="expectedSalary" id="15+"><label for="15+">15+ LPA</label><br><br>


        </fieldset>

        <fieldset>
            <legend>CREATE ACCOUNT</legend>
            <label for=" ">Username: </label><input
            type="text" placeholder="USERNAME"  required><br><br>
            <label for=" ">Password: </label><input
            type="password" placeholder="PASSWORD"  required><br><br>
            <label for=" ">Confirm Password: </label><input
            type="password" placeholder="CONFIRM PASSWORD"><br><br>
            </fieldset>
            <input type="checkbox" name="agree" id=""><label for="">Agree to Terms and Conditions</label> <br><br> 
         <button type="submit">Submit</button>
         <button type="reset">Reset</button>
            </fieldset>
    </form>


</body>
</html>
